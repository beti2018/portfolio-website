    <script>
        /* ========================================
           13. AUTOMATIC TRANSITION TO HOME
        ======================================== */

        window.addEventListener("load", () => {
            const reducedMotion = window.matchMedia(
                "(prefers-reduced-motion: reduce)"
            ).matches;

            const transitionDelay = reducedMotion ? 500 : 4000;
            const fadeDelay = reducedMotion ? 50 : 800;

            setTimeout(() => {
                document.body.classList.add("leaving");

                setTimeout(() => {
                    window.location.replace("home.html");
                }, fadeDelay);
            }, transitionDelay);
        });
    </script>
</body>
